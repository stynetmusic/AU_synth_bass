name: Build AU_synth_bass

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build macOS Audio Unit (arm64)
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify build tools
        run: |
          echo "=== Xcode ==="
          xcodebuild -version
          echo "=== Clang ==="
          clang --version
          echo "=== Architecture ==="
          uname -m
          echo "=== Make ==="
          make --version | head -1

      - name: Build AU plugin (arm64)
        run: |
          make clean
          make

      - name: Verify binary architecture
        run: |
          echo "=== Binary info ==="
          file AU_synth_bass.component/Contents/MacOS/AU_synth_bass
          lipo -info AU_synth_bass.component/Contents/MacOS/AU_synth_bass

      - name: Install to plugin directory
        run: |
          make install
          echo "=== Installed plugins ==="
          ls -la ~/Library/Audio/Plug-Ins/Components/

      - name: Validate bundle structure
        run: |
          echo "=== Bundle files ==="
          find AU_synth_bass.component -type f | sort
          echo ""
          echo "=== Info.plist ==="
          /usr/libexec/PlistBuddy -c "Print" AU_synth_bass.component/Contents/Info.plist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AU_synth_bass.arm64.plugin
          path: AU_synth_bass.component
          retention-days: 30
          if-no-files-found: error

  package-release:
    name: Package Release (arm64)
    runs-on: macos-14
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build AU plugin (arm64)
        run: |
          make clean
          make

      - name: Package as tar.gz
        run: |
          tar -czf AU_synth_bass-${{ github.sha }}.tar.gz AU_synth_bass.component/
          ls -lh AU_synth_bass-*.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AU_synth_bass-release
          path: AU_synth_bass-${{ github.sha }}.tar.gz
          retention-days: 90
          if-no-files-found: error

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: AU_synth_bass-${{ github.sha }}.tar.gz
          name: AU_synth_bass ${{ github.ref_name }}
          body: |
            macOS Audio Unit plugin build (arm64)

            ## Install
            Copy `AU_synth_bass.component` to:
            - `~/Library/Audio/Plug-Ins/Components/` (user)
            - `/Library/Audio/PPlug-Ins/` (all users)

            Then restart your AU host (Ableton Live, Logic Pro, GarageBand, etc.)
          draft: false
          prerelease: false
